<!DOCTYPE html>
<html>
<head>
  <title>Sound Squares Control</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      margin: 0;
      min-height: 100vh;
      padding: 24px 18px 120px;
      box-sizing: border-box;
      overflow-y: auto;
      touch-action: manipulation;
      user-select: none;
    }

    h1 {
      margin: 10px 0 6px;
      font-weight: 600;
      text-align: center;
    }

    .subtitle {
      color: #ccc;
      margin-bottom: 18px;
      font-size: 15px;
      text-align: center;
    }

    .back-button {
      position: fixed;
      top: 18px;
      left: 18px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      text-decoration: none;
      display: grid;
      place-items: center;
      font-size: 24px;
      color: #222;
      background: rgba(255,255,255,0.86);
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      backdrop-filter: blur(8px);
      z-index: 1000;
      transition: 0.12s;
    }

    .back-button:hover,
    .back-button:active {
      transform: scale(0.94);
      filter: brightness(1.08);
    }

    .section-title {
      color: #ddd;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin: 18px 0 10px;
      text-transform: uppercase;
      text-align: center;
    }

    .key-grid {
      display: grid;
      width: min(92vmin, 620px);
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-bottom: 8px;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: min(92vmin, 320px);
      margin-bottom: 8px;
    }

    .architecture-grid {
      display: grid;
      width: min(92vmin, 620px);
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 8px;
    }

    .tone-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: min(92vmin, 420px);
      margin-bottom: 8px;
    }

    .octave-grid {
      display: grid;
      width: min(92vmin, 520px);
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .square {
      border: none;
      border-radius: 16px;
      min-height: 72px;
      font-size: clamp(12px, 2.3vmin, 18px);
      font-weight: bold;
      color: white;
      box-shadow: 0 6px 14px rgba(0,0,0,0.35);
      transition: 0.12s;
      cursor: pointer;
      text-align: center;
      padding: 6px;
    }

    .square.selected {
      transform: scale(0.94);
      outline: 4px solid rgba(255,255,255,0.98);
      outline-offset: -5px;
      filter: brightness(1.3);
      box-shadow:
        0 0 28px rgba(255,255,255,0.9),
        0 6px 14px rgba(0,0,0,0.35);
    }

    .major-square {
      background: #fff6c9;
      color: #222;
    }

    .minor-square {
      background: #444;
      color: white;
    }

    .architecture-square {
      color: white;
    }

    .diatonic {
      background: #4d6f91;
    }

    .pentatonic {
      background: #4f6f5d;
    }

    .blues {
      background: #3f4e6f;
    }

    .modal {
      background: #5b4a6b;
    }

    .chromatic {
      background: #666;
    }

    .tone-square {
      background: #2c2c2c;
    }

    .octave-square {
      background: #3b3b3b;
    }

    .apply-bar {
      position: sticky;
      bottom: 0;
      width: 100%;
      max-width: 720px;
      padding: 12px 12px 16px;
      background: linear-gradient(
        to top,
        rgba(17,17,17,0.98),
        rgba(17,17,17,0.86)
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 900;
    }

    #selectionLabel {
      color: #ccc;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
      min-height: 22px;
      text-align: center;
      line-height: 1.35;
    }

    #enterButton {
      padding: 12px 22px;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      background: white;
      color: #111;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }

    .c  { background: #ff6b6b; }
    .db { background: linear-gradient(135deg, #ff6b6b, #f7b267); }
    .d  { background: #f7b267; }
    .eb { background: linear-gradient(135deg, #f7b267, #ffd93d); color: #222; }
    .e  { background: #ffd93d; color: #222; }
    .f  { background: #6bcb77; }
    .gb { background: linear-gradient(135deg, #6bcb77, #4d96ff); }
    .g  { background: #4d96ff; }
    .ab { background: linear-gradient(135deg, #4d96ff, #9d4edd); }
    .a  { background: #9d4edd; }
    .bb { background: linear-gradient(135deg, #9d4edd, #ff8fab); }
    .b  { background: #ff8fab; }
  </style>
</head>

<body>

  <a class="back-button" href="index.html">←</a>

  <h1>Sound Squares Control</h1>

  <div class="subtitle">
    Choose a root, modality, architecture, tone visibility, and octave range.
  </div>

  <div class="section-title">Root</div>
  <div class="key-grid" id="keyGrid"></div>

  <div class="section-title">Modality</div>

  <div class="mode-grid">
    <button class="square major-square selected" id="majorButton">
      Major
    </button>

    <button class="square minor-square" id="minorButton">
      Minor
    </button>
  </div>

  <div class="section-title">Architecture</div>

  <div class="architecture-grid">
    <button
      class="square architecture-square diatonic selected"
      data-architecture="diatonic">
      Diatonic
    </button>

    <button
      class="square architecture-square pentatonic"
      data-architecture="pentatonic">
      Pentatonic
    </button>

    <button
      class="square architecture-square blues"
      data-architecture="blues">
      Blues
    </button>

    <button
      class="square architecture-square modal"
      data-architecture="modal">
      Modal
    </button>

    <button
      class="square architecture-square chromatic"
      data-architecture="chromatic">
      Chromatic
    </button>
  </div>

  <div class="section-title">Tone Display</div>

  <div class="tone-grid">
    <button
      class="square tone-square selected"
      data-set="native">
      Native Only
    </button>

    <button
      class="square tone-square"
      data-set="full">
      Full Set
    </button>
  </div>

  <div class="section-title">Visible Octaves</div>

  <div class="octave-grid">
    <button class="square octave-square" data-octave="1">1</button>

    <button class="square octave-square selected" data-octave="2">2</button>

    <button class="square octave-square selected" data-octave="3">3</button>

    <button class="square octave-square selected" data-octave="4">4</button>

    <button class="square octave-square selected" data-octave="5">5</button>

    <button class="square octave-square" data-octave="6">6</button>
  </div>

  <div class="apply-bar">

    <div id="selectionLabel">
      C Major · Diatonic · Native Only · Octaves 2,3,4,5
    </div>

    <button id="enterButton">Enter Grid</button>

  </div>

  <script>
    const keyGrid = document.getElementById("keyGrid");
    const selectionLabel =
      document.getElementById("selectionLabel");

    const enterButton =
      document.getElementById("enterButton");

    const majorButton =
      document.getElementById("majorButton");

    const minorButton =
      document.getElementById("minorButton");

    let selectedRoot = "C";
    let selectedMode = "M";
    let selectedArchitecture = "diatonic";
    let selectedSet = "native";
    let selectedOctaves = [2,3,4,5];

    const displayNames = {
      C:  "C",
      Db: "C#/Db",
      D:  "D",
      Eb: "D#/Eb",
      E:  "E",
      F:  "F",
      Gb: "F#/Gb",
      G:  "G",
      Ab: "G#/Ab",
      A:  "A",
      Bb: "A#/Bb",
      B:  "B"
    };

    const notes = [
      { name: "C",  className: "c"  },
      { name: "Db", className: "db" },
      { name: "D",  className: "d"  },
      { name: "Eb", className: "eb" },
      { name: "E",  className: "e"  },
      { name: "F",  className: "f"  },
      { name: "Gb", className: "gb" },
      { name: "G",  className: "g"  },
      { name: "Ab", className: "ab" },
      { name: "A",  className: "a"  },
      { name: "Bb", className: "bb" },
      { name: "B",  className: "b"  }
    ];

    function buildKeyGrid() {
      keyGrid.innerHTML = "";

      notes.forEach(note => {
        const button = document.createElement("button");

        button.classList.add("square");
        button.classList.add(note.className);

        if (note.name === selectedRoot) {
          button.classList.add("selected");
        }

        button.dataset.root = note.name;
        button.textContent = displayNames[note.name];

        button.addEventListener("click", () => {
          selectedRoot = note.name;

          buildKeyGrid();
          updateSelectionLabel();
        });

        keyGrid.appendChild(button);
      });
    }

    function updateModeButtons() {
      majorButton.classList.toggle(
        "selected",
        selectedMode === "M"
      );

      minorButton.classList.toggle(
        "selected",
        selectedMode === "m"
      );
    }

    function updateArchitectureButtons() {
      document
        .querySelectorAll(".architecture-square")
        .forEach(button => {

          button.classList.toggle(
            "selected",
            button.dataset.architecture ===
              selectedArchitecture
          );
        });
    }

    function updateToneButtons() {
      document
        .querySelectorAll(".tone-square")
        .forEach(button => {

          button.classList.toggle(
            "selected",
            button.dataset.set === selectedSet
          );
        });
    }

    function updateOctaveButtons() {
      document
        .querySelectorAll(".octave-square")
        .forEach(button => {

          const octave =
            parseInt(button.dataset.octave, 10);

          button.classList.toggle(
            "selected",
            selectedOctaves.includes(octave)
          );
        });
    }

    function architectureName(value) {
      const names = {
        diatonic: "Diatonic",
        pentatonic: "Pentatonic",
        blues: "Blues",
        modal: "Modal",
        chromatic: "Chromatic"
      };

      return names[value] || value;
    }

    function modeName(mode) {
      return mode === "M"
        ? "Major"
        : "Minor";
    }

    function updateSelectionLabel() {
      selectionLabel.textContent =
        displayNames[selectedRoot] +
        " " +
        modeName(selectedMode) +
        " · " +
        architectureName(selectedArchitecture) +
        " · " +
        (selectedSet === "native"
          ? "Native Only"
          : "Full Set") +
        " · Octaves " +
        selectedOctaves.join(",");
    }

    majorButton.addEventListener("click", () => {
      selectedMode = "M";

      updateModeButtons();
      updateSelectionLabel();
    });

    minorButton.addEventListener("click", () => {
      selectedMode = "m";

      updateModeButtons();
      updateSelectionLabel();
    });

    document
      .querySelectorAll(".architecture-square")
      .forEach(button => {

        button.addEventListener("click", () => {
          selectedArchitecture =
            button.dataset.architecture;

          updateArchitectureButtons();
          updateSelectionLabel();
        });
      });

    document
      .querySelectorAll(".tone-square")
      .forEach(button => {

        button.addEventListener("click", () => {
          selectedSet = button.dataset.set;

          updateToneButtons();
          updateSelectionLabel();
        });
      });

    document
      .querySelectorAll(".octave-square")
      .forEach(button => {

        button.addEventListener("click", () => {

          const octave =
            parseInt(button.dataset.octave, 10);

          if (selectedOctaves.includes(octave)) {
            selectedOctaves =
              selectedOctaves.filter(o => o !== octave);
          } else {
            selectedOctaves.push(octave);
          }

          selectedOctaves.sort((a,b) => a - b);

          if (selectedOctaves.length === 0) {
            selectedOctaves = [2,3,4,5];
          }

          updateOctaveButtons();
          updateSelectionLabel();
        });
      });

    enterButton.addEventListener("click", () => {

      const root =
        encodeURIComponent(selectedRoot);

      const mode =
        encodeURIComponent(selectedMode);

      const architecture =
        encodeURIComponent(selectedArchitecture);

      const setView =
        encodeURIComponent(selectedSet);

      const octaves =
        encodeURIComponent(selectedOctaves.join(","));

      window.location.href =
        `western.html?root=${root}&mode=${mode}&architecture=${architecture}&set=${setView}&octaves=${octaves}`;
    });

    buildKeyGrid();
    updateModeButtons();
    updateArchitectureButtons();
    updateToneButtons();
    updateOctaveButtons();
    updateSelectionLabel();
  </script>

</body>
</html>
