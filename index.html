<!DOCTYPE html>
<html>
<head>
  <title>Sound Squares</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #f5f0e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
    }

    h1 {
      margin: 10px 0 6px 0;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #bdb4a6;
      margin-bottom: 22px;
      font-size: 14px;
    }

    .menu-grid {
      display: grid;
      width: min(90vmin, 520px);
      height: min(90vmin, 520px);
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 3%;
    }

    .tile {
      text-decoration: none;
      color: #fff7ea;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 18px rgba(0,0,0,0.38);
      transition: 0.12s;
      user-select: none;
    }

    .tile:active,
    .tile:hover {
      transform: scale(0.95);
      filter: brightness(1.18);
      box-shadow: 0 0 26px rgba(255,255,255,0.25);
    }

    .abbr {
      font-size: clamp(28px, 8vmin, 54px);
      font-weight: bold;
      letter-spacing: 1px;
    }

    .label {
      margin-top: 8px;
      font-size: clamp(11px, 2.4vmin, 16px);
      opacity: 0.9;
    }

    .western  { background: #4d6f91; }
    .japanese { background: #7a6a53; }
    .chinese  { background: #8f3f2f; }
    .indian   { background: #d08a2d; color: #18120c; }
    .maqam    { background: #5b4a6b; }
    .celtic   { background: #47624f; }
    .blues    { background: #3f4e6f; }
    .african  { background: #8b3e2f; }
    .andean   { background: #5f6f72; }
  </style>
</head>

<body>

  <h1>Sound Squares</h1>

  <div class="subtitle">
    Choose a musical world
  </div>

  <div class="menu-grid">

    <a class="tile western" href="western-start.html">
      <div class="abbr">WE</div>
      <div class="label">Western</div>
    </a>

    <a class="tile japanese" href="japanese.html">
      <div class="abbr">JA</div>
      <div class="label">Japanese</div>
    </a>

    <a class="tile chinese" href="chinese.html">
      <div class="abbr">CH</div>
      <div class="label">Chinese</div>
    </a>

    <a class="tile indian" href="indian.html">
      <div class="abbr">IN</div>
      <div class="label">Indian</div>
    </a>

    <a class="tile maqam" href="maqam.html">
      <div class="abbr">MA</div>
      <div class="label">Maqam</div>
    </a>

    <a class="tile celtic" href="celtic.html">
      <div class="abbr">CE</div>
      <div class="label">Celtic</div>
    </a>

    <a class="tile blues" href="blues.html">
      <div class="abbr">BL</div>
      <div class="label">Blues</div>
    </a>

    <a class="tile african" href="african.html">
      <div class="abbr">AF</div>
      <div class="label">African</div>
    </a>

    <a class="tile andean" href="andean.html">
      <div class="abbr">AN</div>
      <div class="label">Andean</div>
    </a>

  </div>

</body>
</html>
