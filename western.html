<!DOCTYPE html>
<html>
<head>
  <title>Western Sound Square</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    h1 { margin: 8px 0; }

    #gridLabel {
      margin-bottom: 8px;
      color: #ccc;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    #startButton {
      font-size: 18px;
      padding: 12px 20px;
      margin: 6px 0;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      cursor: pointer;
    }

    #status {
      margin-bottom: 10px;
      color: #ccc;
      font-size: 18px;
      height: 26px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .top-button {
      position: fixed;
      top: 18px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      text-decoration: none;
      display: grid;
      place-items: center;
      font-size: 24px;
      color: #222;
      background: rgba(255,255,255,0.86);
      box-shadow: 0 4px 14px rgba(0,0,0,0.18);
      backdrop-filter: blur(8px);
      z-index: 1000;
      transition: 0.12s;
    }

    .top-button:hover,
    .top-button:active {
      transform: scale(0.94);
      filter: brightness(1.08);
    }

    .back-button { left: 18px; }
    .settings-button { right: 18px; }

    .grid {
      width: min(92vmin, 720px);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .octave-row {
      display: grid;
      gap: 10px;
      justify-content: center;
    }

    .square {
      border: none;
      border-radius: 16px;
      aspect-ratio: 1 / 1;
      width: 100%;
      font-size: clamp(7px, 1.4vmin, 14px);
      font-weight: bold;
      color: white;
      transition: 0.08s;
      cursor: pointer;
      line-height: 1.05;
      padding: 4px;
      text-align: center;
    }

.native {
  box-shadow:
    0 0 32px rgba(255,255,255,0.98),
    0 6px 14px rgba(0,0,0,0.35);
  filter: brightness(1.25);
}

.root {
  outline: 3px solid rgba(255,255,255,1);
  outline-offset: -5px;
}

    .outside {
      box-shadow:
        0 0 14px rgba(150,150,150,0.5),
        0 6px 14px rgba(0,0,0,0.35);
      filter: brightness(0.72) saturate(0.65);
    }

    .root {
      outline: 3px solid rgba(255,255,255,1);
      outline-offset: -5px;
      filter: brightness(1.28);
    }

    .square.active {
      transform: scale(0.9);
      filter: brightness(1.65);
      box-shadow:
        0 0 32px rgba(255,255,255,0.98),
        0 6px 14px rgba(0,0,0,0.35);
    }

    .c  { background: #ff6b6b; }
    .db { background: linear-gradient(135deg, #ff6b6b, #f7b267); }
    .d  { background: #f7b267; }
    .eb { background: linear-gradient(135deg, #f7b267, #ffd93d); color: #222; }
    .e  { background: #ffd93d; color: #222; }
    .f  { background: #6bcb77; }
    .gb { background: linear-gradient(135deg, #6bcb77, #4d96ff); }
    .g  { background: #4d96ff; }
    .ab { background: linear-gradient(135deg, #4d96ff, #9d4edd); }
    .a  { background: #9d4edd; }
    .bb { background: linear-gradient(135deg, #9d4edd, #ff8fab); }
    .b  { background: #ff8fab; }
  </style>
</head>

<body>

  <a class="top-button back-button" href="index.html" title="Back">←</a>
  <a class="top-button settings-button" href="selection-control.html" title="Control Settings">⚙</a>

  <h1>Western Sound Square</h1>

  <div id="gridLabel">Western Grid</div>

  <button id="startButton">Start Audio</button>

  <div id="status">Tap Start Audio</div>

  <div id="grid" class="grid"></div>

  <script>
    let audioContext;

    const startButton = document.getElementById("startButton");
    const statusText = document.getElementById("status");
    const gridLabel = document.getElementById("gridLabel");
    const grid = document.getElementById("grid");

    const activeNotes = new Map();

    const pcToNumber = {
      C: 0, Db: 1, D: 2, Eb: 3, E: 4, F: 5,
      Gb: 6, G: 7, Ab: 8, A: 9, Bb: 10, B: 11
    };

    const numberToPc = [
      "C", "Db", "D", "Eb", "E", "F",
      "Gb", "G", "Ab", "A", "Bb", "B"
    ];

    const displayNames = {
      C:  "C",
      Db: "C#/Db",
      D:  "D",
      Eb: "D#/Eb",
      E:  "E",
      F:  "F",
      Gb: "F#/Gb",
      G:  "G",
      Ab: "G#/Ab",
      A:  "A",
      Bb: "A#/Bb",
      B:  "B"
    };

    const pcClass = {
      C: "c", Db: "db", D: "d", Eb: "eb", E: "e", F: "f",
      Gb: "gb", G: "g", Ab: "ab", A: "a", Bb: "bb", B: "b"
    };

    const scaleFormulas = {
      M: [0, 2, 4, 5, 7, 9, 11],
      m: [0, 2, 3, 5, 7, 8, 10]
    };

    function getSettingsFromUrl() {
      const params = new URLSearchParams(window.location.search);

      const root = params.get("root") || "C";
      const mode = params.get("mode") || "M";
      const setView = params.get("set") || "full";
      const octavesParam = params.get("octaves") || "2,3,4,5";

      let octaves = octavesParam
        .split(",")
        .map(value => parseInt(value, 10))
        .filter(value => value >= 1 && value <= 6);

      if (octaves.length === 0) {
        octaves = [2, 3, 4, 5];
      }

      octaves = [...new Set(octaves)].sort((a, b) => a - b);

      return {
        root: pcToNumber[root] !== undefined ? root : "C",
        mode: scaleFormulas[mode] ? mode : "M",
        setView: setView === "native" ? "native" : "full",
        octaves
      };
    }

    function modeName(mode) {
      return mode === "M" ? "Major" : "Minor";
    }

    function viewName(setView) {
      return setView === "native" ? "Native Only" : "Full Set";
    }

    function midiToPc(midi) {
      return numberToPc[midi % 12];
    }

    function midiToOctave(midi) {
      return Math.floor(midi / 12) - 1;
    }

    function midiToFrequency(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function buildGrid() {
      stopAllNotes();

      const { root, mode, setView, octaves } = getSettingsFromUrl();

      const rootNumber = pcToNumber[root];
      const scale = scaleFormulas[mode];

      grid.innerHTML = "";

      octaves.forEach(octave => {
        const row = document.createElement("div");
        row.classList.add("octave-row");

        const startMidi = 12 * (octave + 1) + rootNumber;
        const endMidi = startMidi + scale[6];

        const buttonsForRow = [];

        for (let midi = startMidi; midi <= endMidi; midi++) {
          const pc = midiToPc(midi);
          const noteOctave = midiToOctave(midi);
          const intervalFromRoot = (midi - startMidi) % 12;
          const isNative = scale.includes(intervalFromRoot);
          const isRoot = intervalFromRoot === 0;

          if (setView === "native" && !isNative) {
            continue;
          }

          const button = document.createElement("button");

          button.classList.add("square");
          button.classList.add(pcClass[pc]);
          button.classList.add(isNative ? "native" : "outside");

          if (isRoot) {
            button.classList.add("root");
          }

          button.dataset.name = pc + noteOctave;
          button.dataset.displayName = displayNames[pc] + noteOctave;
          button.dataset.note = midiToFrequency(midi).toFixed(2);
          button.dataset.pc = pc;
          button.dataset.midi = midi;

          button.textContent = displayNames[pc] + noteOctave;

          attachSquareEvents(button);
          buttonsForRow.push(button);
        }

        row.style.gridTemplateColumns =
          `repeat(${buttonsForRow.length}, minmax(0, 1fr))`;

        buttonsForRow.forEach(button => row.appendChild(button));

        grid.appendChild(row);
      });

      gridLabel.textContent =
        displayNames[root] +
        " " +
        modeName(mode) +
        " · " +
        viewName(setView) +
        " · Octaves " +
        octaves.join(", ");

      statusText.textContent =
        displayNames[root] + " " + modeName(mode);
    }

    function startAudio() {
      if (audioContext) return;

      audioContext =
        new (window.AudioContext || window.webkitAudioContext)();

      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();

      osc.frequency.value = 440;
      gain.gain.value = 0.05;

      osc.connect(gain);
      gain.connect(audioContext.destination);

      osc.start();
      osc.stop(audioContext.currentTime + 0.1);

      statusText.textContent = "Audio Ready";
      startButton.style.display = "none";
    }

    startButton.addEventListener("click", startAudio);
    startButton.addEventListener("touchend", startAudio);

    function startSustainedNote(button, pointerId) {
      if (!audioContext) {
        statusText.textContent = "Tap Start Audio first";
        return;
      }

      if (activeNotes.has(pointerId)) return;

      const now = audioContext.currentTime;
      const freq = parseFloat(button.dataset.note);

      const gain = audioContext.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.18, now + 0.025);

      const osc = audioContext.createOscillator();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, now);

      const filter = audioContext.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(1500, now);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioContext.destination);

      osc.start(now);

      activeNotes.set(pointerId, {
        button,
        osc,
        gain,
        pc: button.dataset.pc,
        name: button.dataset.name,
        displayName: button.dataset.displayName,
        midi: parseInt(button.dataset.midi, 10)
      });

      button.classList.add("active");

      updateStatus();
    }

    function stopSustainedNote(pointerId) {
      const note = activeNotes.get(pointerId);

      if (!note || !audioContext) return;

      const now = audioContext.currentTime;

      note.gain.gain.cancelScheduledValues(now);
      note.gain.gain.setValueAtTime(note.gain.gain.value, now);
      note.gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);

      note.osc.stop(now + 0.1);
      note.button.classList.remove("active");

      activeNotes.delete(pointerId);

      updateStatus();
    }

    function stopAllNotes() {
      Array.from(activeNotes.keys()).forEach(pointerId => {
        stopSustainedNote(pointerId);
      });
    }

    function updateStatus() {
      const notes = Array.from(activeNotes.values())
        .sort((a, b) => a.midi - b.midi);

      if (notes.length === 0) {
        const { root, mode } = getSettingsFromUrl();

        statusText.textContent =
          displayNames[root] + " " + modeName(mode);

        return;
      }

      if (notes.length >= 3) {
        statusText.textContent =
          nameChord(notes) + " Chord";
      } else {
        statusText.textContent =
          notes.map(n => n.displayName).join(" – ");
      }
    }

    function nameChord(notes) {
      const pcs = [];
      const pcSeen = new Set();

      notes.forEach(note => {
        if (!pcSeen.has(note.pc)) {
          pcs.push(note.pc);
          pcSeen.add(note.pc);
        }
      });

      const numbers = pcs.map(pc => pcToNumber[pc]);
      const lowestPc = notes[0].pc;

      for (const rootPc of pcs) {
        const root = pcToNumber[rootPc];

        const has = interval =>
          numbers.includes((root + interval) % 12);

        const majorTriad = has(4) && has(7);
        const minorTriad = has(3) && has(7);
        const diminishedTriad = has(3) && has(6);

        const major7 = has(11);
        const dominant7 = has(10);

        if (majorTriad) {
          const rootName = getRootName(rootPc, notes);
          const voicing = getVoicing(rootPc, lowestPc);

          if (major7) return rootName + "Mv" + voicing + "7";
          if (dominant7) return rootName + "Mv" + voicing + "D7";

          return rootName + "Mv" + voicing;
        }

        if (minorTriad) {
          const rootName = getRootName(rootPc, notes);
          const voicing = getVoicing(rootPc, lowestPc);

          return rootName + "mv" + voicing;
        }

        if (diminishedTriad) {
          const rootName = getRootName(rootPc, notes);
          const voicing = getVoicing(rootPc, lowestPc);

          return rootName + "dimv" + voicing;
        }
      }

      return pcs.join(" – ");
    }

    function getRootName(rootPc, notes) {
      const matchingRootNotes = notes
        .filter(note => note.pc === rootPc)
        .sort((a, b) => a.midi - b.midi);

      if (matchingRootNotes.length > 0) {
        return matchingRootNotes[0].name;
      }

      return rootPc;
    }

    function getVoicing(rootPc, lowestPc) {
      const root = pcToNumber[rootPc];
      const lowest = pcToNumber[lowestPc];
      const interval = (lowest - root + 12) % 12;

      if (interval === 0) return "1";
      if (interval === 3 || interval === 4) return "2";
      if (interval === 6 || interval === 7) return "3";
      if (interval === 10 || interval === 11) return "4";

      return "1";
    }

    function attachSquareEvents(button) {
      button.addEventListener("pointerdown", event => {
        event.preventDefault();

        if (!audioContext) {
          statusText.textContent = "Tap Start Audio first";
          return;
        }

        button.setPointerCapture(event.pointerId);

        startSustainedNote(button, event.pointerId);
      });

      button.addEventListener("pointerup", event => {
        event.preventDefault();

        stopSustainedNote(event.pointerId);
      });

      button.addEventListener("pointercancel", event => {
        stopSustainedNote(event.pointerId);
      });
    }

    document.addEventListener("pointerup", event => {
      stopSustainedNote(event.pointerId);
    });

    document.addEventListener("pointercancel", event => {
      stopSustainedNote(event.pointerId);
    });

    buildGrid();
  </script>

</body>
</html>
