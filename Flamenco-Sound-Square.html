<!DOCTYPE html>
<html>
<head>
  <title>Flamenco Sound Square</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #160d0a;
      color: #f7eadc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    h1 { margin: 10px 0; font-weight: 500; }

    #startButton {
      font-size: 18px;
      padding: 12px 20px;
      margin: 10px 0;
      border: none;
      border-radius: 12px;
      background: #c96b36;
      color: #160d0a;
      cursor: pointer;
    }

    #status {
      margin-bottom: 10px;
      color: #d6b29a;
      font-size: 14px;
      height: 20px;
    }

    .grid {
      display: grid;
      width: min(90vmin, 420px);
      height: min(90vmin, 420px);
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 2%;
    }

    .square {
      border: none;
      border-radius: 18px;
      font-size: clamp(15px, 3.5vmin, 26px);
      font-weight: bold;
      color: #fff1e3;
      box-shadow: 0 6px 14px rgba(0,0,0,0.38);
      transition: 0.08s;
    }

    .square.active {
      transform: scale(0.9);
      filter: brightness(1.4);
      box-shadow: 0 0 26px rgba(230, 95, 45, 0.8);
    }

    .c  { background: #8a2f24; }  /* deep red */
    .db { background: #a85332; }  /* burnt orange */
    .e  { background: #c68b3c; }  /* amber */
    .f  { background: #6b4f3a; }  /* worn wood */
    .g  { background: #3f4b42; }  /* dark olive */
    .ab { background: #5c3a47; }  /* wine */
    .bb { background: #7b5135; }  /* leather */
  </style>
</head>

<body>

  <h1>Flamenco Square</h1>

  <button id="startButton">Start Audio</button>
  <div id="status">Tap Start Audio</div>

  <div class="grid">
    <button class="square c"  data-name="C3"  data-note="130.81">C</button>
    <button class="square db" data-name="Db3" data-note="138.59">Db</button>
    <button class="square e"  data-name="E3"  data-note="164.81">E</button>
    <button class="square f"  data-name="F3"  data-note="174.61">F</button>

    <button class="square g"  data-name="G3"  data-note="196.00">G</button>
    <button class="square ab" data-name="Ab3" data-note="207.65">Ab</button>
    <button class="square bb" data-name="Bb3" data-note="233.08">Bb</button>
    <button class="square c"  data-name="C4"  data-note="261.63">C</button>

    <button class="square db" data-name="Db4" data-note="277.18">Db</button>
    <button class="square e"  data-name="E4"  data-note="329.63">E</button>
    <button class="square f"  data-name="F4"  data-note="349.23">F</button>
    <button class="square g"  data-name="G4"  data-note="392.00">G</button>

    <button class="square ab" data-name="Ab4" data-note="415.30">Ab</button>
    <button class="square bb" data-name="Bb4" data-note="466.16">Bb</button>
    <button class="square c"  data-name="C5"  data-note="523.25">C</button>
    <button class="square c"  data-name="C5"  data-note="523.25">C</button>
  </div>

  <script>
    let audioContext;
    let currentFingerButton = null;
    let droneOsc1 = null;
    let droneOsc2 = null;
    let droneGain = null;

    const startButton = document.getElementById("startButton");
    const statusText = document.getElementById("status");

    function startAudio() {
      if (audioContext) return;

      audioContext = new (window.AudioContext || window.webkitAudioContext)();

      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();

      osc.frequency.value = 440;
      gain.gain.value = 0.04;

      osc.connect(gain);
      gain.connect(audioContext.destination);

      osc.start();
      osc.stop(audioContext.currentTime + 0.1);

      startDrone();

      statusText.textContent = "Audio Ready";
      startButton.style.display = "none";
    }

    startButton.addEventListener("click", startAudio);
    startButton.addEventListener("touchend", startAudio);

    function startDrone() {
      const now = audioContext.currentTime;

      droneGain = audioContext.createGain();
      droneGain.gain.setValueAtTime(0.0001, now);
      droneGain.gain.exponentialRampToValueAtTime(0.025, now + 1.0);

      const filter = audioContext.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 420;

      droneOsc1 = audioContext.createOscillator();
      droneOsc1.type = "sine";
      droneOsc1.frequency.value = 130.81; // C

      droneOsc2 = audioContext.createOscillator();
      droneOsc2.type = "sine";
      droneOsc2.frequency.value = 196.00; // G

      droneOsc1.connect(filter);
      droneOsc2.connect(filter);
      filter.connect(droneGain);
      droneGain.connect(audioContext.destination);

      droneOsc1.start();
      droneOsc2.start();
    }

    function playNote(freq) {
      if (!audioContext) {
        statusText.textContent = "Tap Start Audio first";
        return;
      }

      const now = audioContext.currentTime;

      const gain = audioContext.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.26, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);

      const osc1 = audioContext.createOscillator();
      osc1.type = "sawtooth";
      osc1.frequency.setValueAtTime(freq, now);

      const osc2 = audioContext.createOscillator();
      osc2.type = "triangle";
      osc2.frequency.setValueAtTime(freq * 2, now);

      const osc2Gain = audioContext.createGain();
      osc2Gain.gain.value = 0.08;

      const filter = audioContext.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(1700, now);
      filter.frequency.exponentialRampToValueAtTime(650, now + 0.6);

      osc1.connect(filter);
      osc2.connect(osc2Gain);
      osc2Gain.connect(filter);
      filter.connect(gain);
      gain.connect(audioContext.destination);

      osc1.start(now);
      osc2.start(now);

      osc1.stop(now + 0.75);
      osc2.stop(now + 0.75);
    }

    function flashButton(button) {
      button.classList.add("active");
      setTimeout(() => button.classList.remove("active"), 120);
    }

    function triggerButton(button) {
      if (!button || button === currentFingerButton) return;

      currentFingerButton = button;
      playNote(parseFloat(button.dataset.note));
      statusText.textContent = button.dataset.name;
      flashButton(button);
    }

    function buttonFromPoint(x, y) {
      const element = document.elementFromPoint(x, y);
      if (element && element.classList.contains("square")) {
        return element;
      }
      return null;
    }

    document.querySelectorAll(".square").forEach(button => {
      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        triggerButton(button);
      });
    });

    document.addEventListener("pointermove", event => {
      if (event.buttons !== 1 && event.pointerType === "mouse") return;

      const button = buttonFromPoint(event.clientX, event.clientY);
      if (button) triggerButton(button);
    });

    document.addEventListener("pointerup", () => {
      currentFingerButton = null;
    });

    document.addEventListener("pointercancel", () => {
      currentFingerButton = null;
    });
  </script>

</body>
</html>
