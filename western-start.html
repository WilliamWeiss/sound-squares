<!DOCTYPE html>
<html>
<head>
  <title>Choose Western Key</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    h1 {
      margin: 10px 0;
    }

    #subtitle {
      color: #ccc;
      margin-bottom: 18px;
      font-size: 15px;
      text-align: center;
    }

    .back-button {
      position: fixed;
      top: 18px;
      left: 18px;
      padding: 10px 14px;
      border-radius: 999px;
      text-decoration: none;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #222;
      background: rgba(255,255,255,0.82);
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      backdrop-filter: blur(8px);
      z-index: 1000;
    }

    .key-grid {
      display: grid;
      width: min(92vmin, 560px);
      height: min(40vmin, 220px);
      grid-template-columns: repeat(14, 1fr);
      grid-auto-rows: 1fr;
      gap: 1.4%;
      margin-bottom: 26px;
    }

    .square {
      border: none;
      border-radius: 16px;
      font-size: clamp(10px, 2.5vmin, 18px);
      font-weight: bold;
      color: white;
      box-shadow: 0 6px 14px rgba(0,0,0,0.35);
      transition: 0.12s;
      cursor: pointer;
    }

    .scale-tone {
      grid-column: span 2;
    }

    .non-scale-tone {
      grid-column: span 1;
      font-size: clamp(8px, 1.8vmin, 13px);
      border-radius: 12px;
      opacity: 0.92;
    }

    .square.selected {
      transform: scale(0.92);
      outline: 4px solid rgba(255,255,255,0.95);
      outline-offset: -5px;
      filter: brightness(1.35);
      box-shadow: 0 0 28px rgba(255,255,255,0.85);
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 20px;
    }

    .mode-square {
      width: 120px;
      height: 120px;
      border: none;
      border-radius: 22px;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.12s;
      box-shadow: 0 8px 22px rgba(0,0,0,0.35);
    }

    .mode-square.selected {
      transform: scale(0.94);
      outline: 5px solid rgba(255,255,255,0.95);
      outline-offset: -6px;
      box-shadow: 0 0 34px rgba(255,255,255,0.85);
    }

    .major-square {
      background: #fff6c9;
      color: #222;
    }

    .minor-square {
      background: #444;
      color: white;
    }

    #selectionLabel {
      color: #ccc;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 16px;
      height: 26px;
    }

    #enterButton {
      padding: 14px 24px;
      border: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      background: white;
      color: #111;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }

    .c  { background: #ff6b6b; }
    .db { background: linear-gradient(135deg, #ff6b6b, #f7b267); }
    .d  { background: #f7b267; }
    .eb { background: linear-gradient(135deg, #f7b267, #ffd93d); color: #222; }
    .e  { background: #ffd93d; color: #222; }
    .f  { background: #6bcb77; }
    .gb { background: linear-gradient(135deg, #6bcb77, #4d96ff); }
    .g  { background: #4d96ff; }
    .ab { background: linear-gradient(135deg, #4d96ff, #9d4edd); }
    .a  { background: #9d4edd; }
    .bb { background: linear-gradient(135deg, #9d4edd, #ff8fab); }
    .b  { background: #ff8fab; }
  </style>
</head>

<body>

  <a class="back-button" href="index.html">← Back to Menu</a>

  <h1>Choose Western Key</h1>

  <div id="subtitle">
    Choose a root square and modality before entering the Western grid.
  </div>

  <div class="key-grid" id="keyGrid"></div>

  <div class="mode-grid">

    <button
      class="mode-square major-square selected"
      id="majorButton">
      Major
    </button>

    <button
      class="mode-square minor-square"
      id="minorButton">
      Minor
    </button>

  </div>

  <div id="selectionLabel">C Major</div>

  <button id="enterButton">Enter Western Grid</button>

  <script>

    const keyGrid =
      document.getElementById("keyGrid");

    const selectionLabel =
      document.getElementById("selectionLabel");

    const enterButton =
      document.getElementById("enterButton");

    const majorButton =
      document.getElementById("majorButton");

    const minorButton =
      document.getElementById("minorButton");

    let selectedRoot = "C";
    let selectedMode = "M";

    const notes = [

      {
        name: "C",
        className: "c",
        size: "scale-tone"
      },

      {
        name: "Db",
        className: "db",
        size: "non-scale-tone"
      },

      {
        name: "D",
        className: "d",
        size: "scale-tone"
      },

      {
        name: "Eb",
        className: "eb",
        size: "non-scale-tone"
      },

      {
        name: "E",
        className: "e",
        size: "scale-tone"
      },

      {
        name: "F",
        className: "f",
        size: "scale-tone"
      },

      {
        name: "Gb",
        className: "gb",
        size: "non-scale-tone"
      },

      {
        name: "G",
        className: "g",
        size: "scale-tone"
      },

      {
        name: "Ab",
        className: "ab",
        size: "non-scale-tone"
      },

      {
        name: "A",
        className: "a",
        size: "scale-tone"
      },

      {
        name: "Bb",
        className: "bb",
        size: "non-scale-tone"
      },

      {
        name: "B",
        className: "b",
        size: "scale-tone"
      }
    ];

    function buildKeyGrid() {

      keyGrid.innerHTML = "";

      notes.forEach(note => {

        const button =
          document.createElement("button");

        button.classList.add("square");
        button.classList.add(note.className);
        button.classList.add(note.size);

        if (
          note.name === selectedRoot
        ) {

          button.classList.add("selected");
        }

        button.dataset.root = note.name;

        button.textContent = note.name;

        button.addEventListener(
          "click",
          () => {

            selectedRoot = note.name;

            buildKeyGrid();

            updateSelectionLabel();
          }
        );

        keyGrid.appendChild(button);
      });
    }

    function updateModeButtons() {

      majorButton.classList.toggle(
        "selected",
        selectedMode === "M"
      );

      minorButton.classList.toggle(
        "selected",
        selectedMode === "m"
      );
    }

    function updateSelectionLabel() {

      selectionLabel.textContent =
        selectedRoot +
        " " +
        (
          selectedMode === "M"
            ? "Major"
            : "Minor"
        );
    }

    majorButton.addEventListener(
      "click",
      () => {

        selectedMode = "M";

        updateModeButtons();

        updateSelectionLabel();
      }
    );

    minorButton.addEventListener(
      "click",
      () => {

        selectedMode = "m";

        updateModeButtons();

        updateSelectionLabel();
      }
    );

    enterButton.addEventListener(
      "click",
      () => {

        const root =
          encodeURIComponent(
            selectedRoot
          );

        const mode =
          encodeURIComponent(
            selectedMode
          );

        window.location.href =
          `western.html?root=${root}&mode=${mode}`;
      }
    );

    buildKeyGrid();

    updateModeButtons();

    updateSelectionLabel();

  </script>

</body>
</html>
