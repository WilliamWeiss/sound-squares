<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blues Sound Square</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: #1b1620;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .back-button {
      position: fixed;
      top: 18px;
      left: 18px;
      padding: 10px 14px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      color: #222;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      z-index: 1000;
    }

    h1 {
      margin-bottom: 8px;
      letter-spacing: 0.08em;
    }

    p {
      margin-top: 0;
      color: #d6c9dd;
    }

    .square-grid {
      display: grid;
      grid-template-columns: repeat(3, 90px);
      gap: 14px;
      margin-top: 28px;
    }

    .sound-square {
      width: 90px;
      height: 90px;
      border: none;
      border-radius: 18px;
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    .sound-square:hover {
      transform: translateY(-3px);
      filter: brightness(1.15);
    }

    .sound-square.playing {
      transform: scale(1.08);
      filter: brightness(1.45);
      box-shadow: 0 0 28px currentColor;
    }

    .controls {
      margin-top: 28px;
      display: flex;
      gap: 12px;
    }

    .control-button {
      padding: 12px 18px;
      border: none;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
      background: white;
      color: #1b1620;
    }
  </style>
</head>

<body>
  <a class="back-button" href="index.html">← Back to Menu</a>

  <h1>BLUES</h1>
  <p>C Blues Square — final note resolves to high B♭</p>

  <div class="square-grid">
    <button class="sound-square" style="background:#243b8f;" data-note="C4">C</button>
    <button class="sound-square" style="background:#4b2a88;" data-note="Eb4">E♭</button>
    <button class="sound-square" style="background:#6e2c7f;" data-note="F4">F</button>

    <button class="sound-square" style="background:#8a2d63;" data-note="Gb4">G♭</button>
    <button class="sound-square" style="background:#a5423f;" data-note="G4">G</button>
    <button class="sound-square" style="background:#b46a31;" data-note="Bb4">B♭</button>

    <button class="sound-square" style="background:#d49a3a;" data-note="Bb5">High B♭</button>
  </div>

  <div class="controls">
    <button class="control-button" onclick="playScale()">Play Scale</button>
    <button class="control-button" onclick="stopSound()">Stop</button>
  </div>

  <script>
    let audioContext;
    let currentOscillator = null;

    const noteFrequencies = {
      C4: 261.63,
      Eb4: 311.13,
      F4: 349.23,
      Gb4: 369.99,
      G4: 392.00,
      Bb4: 466.16,
      Bb5: 932.33
    };

    const bluesNotes = [
      "C4",
      "Eb4",
      "F4",
      "Gb4",
      "G4",
      "Bb4",
      "Bb5"
    ];

    function getAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioContext;
    }

    function playNote(note, duration = 0.55) {
      const context = getAudioContext();
      const frequency = noteFrequencies[note];

      if (!frequency) return;

      stopSound();

      const oscillator = context.createOscillator();
      const gainNode = context.createGain();

      oscillator.type = "sawtooth";
      oscillator.frequency.setValueAtTime(frequency, context.currentTime);

      gainNode.gain.setValueAtTime(0.0001, context.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.22, context.currentTime + 0.03);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + duration);

      oscillator.connect(gainNode);
      gainNode.connect(context.destination);

      oscillator.start();
      oscillator.stop(context.currentTime + duration);

      currentOscillator = oscillator;

      const square = document.querySelector(`[data-note="${note}"]`);
      if (square) {
        square.classList.add("playing");
        setTimeout(() => square.classList.remove("playing"), duration * 1000);
      }
    }

    function stopSound() {
      if (currentOscillator) {
        try {
          currentOscillator.stop();
        } catch (e) {}
        currentOscillator = null;
      }
    }

    function playScale() {
      bluesNotes.forEach((note, index) => {
        setTimeout(() => {
          playNote(note, 0.45);
        }, index * 500);
      });
    }

    document.querySelectorAll(".sound-square").forEach(square => {
      square.addEventListener("click", () => {
        playNote(square.dataset.note);
      });
    });
  </script>
</body>
</html>
